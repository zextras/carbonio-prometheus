global:
  resolve_timeout: 5m
  smtp_from: 'notifier@example.com'
  smtp_smarthost: 'smtp.example.com:587'
  smtp_auth_username: 'notifier@example.com'
  smtp_auth_password: 'password'
  smtp_require_tls: true

templates:
  - "/etc/carbonio/carbonio-prometheus-alertmanager/templates/*.tmpl"

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 1h
  receiver: email
  routes:
    - matchers:
        - severity="blocker"
      receiver: telegram
      group_wait: 10s
      repeat_interval: 8h
      continue: false
    - matchers:
        - severity="warning"
      receiver: email_external
      group_wait: 30s
      repeat_interval: 2h
      continue: false
    - matchers:
        - severity="alert"
      receiver: email
      continue: false

receivers:
  - name: 'email_external'
    email_configs:
    - to: 'email@externaldomain.com'
      headers:
        subject: '{{ template "custom_mail_subject" . }}'
        html: '{{ template "custom_mail_html" . }}'
  - name: 'email'
    email_configs:
    - to: 'email@example.com'
      headers:
        subject: '{{ template "custom_mail_subject" . }}'
        html: '{{ template "custom_mail_html" . }}'
  - name: 'telegram'
    telegram_configs:
    - bot_token: 'telegramToken'
      api_url: 'https://api.telegram.org'
      chat_id: 12345678
      message: '{{ template "telegram.message" . }}'
      parse_mode: 'HTML'