groups:
  - name: consul_service_down
    interval: 15s
    rules:
      - alert: consul_service_down_10m
        expr: probe_success{job="blackbox-mesh"} == 0
        for: 10m
        labels:
          severity: blocker
          service: consul
          job: blackbox-mesh
        annotations:
          summary: "Consul service is unreachable on {{ $labels.instance }}"
          description: "Blackbox probe to Consul (port 8301) failed for {{ $labels.instance }} for more than 10 minutes. Check Consul agent/server status and network connectivity."
      - alert: consul_service_down_5m
        expr: probe_success{job="blackbox-mesh"} == 0
        for: 5m
        labels:
          severity: warning
          service: consul
          job: blackbox-mesh
        annotations:
          summary: "Consul service is unreachable on {{ $labels.instance }}"
          description: "Blackbox probe to Consul (port 8301) failed for {{ $labels.instance }} for more than 5 minutes."
      - alert: consul_service_down_1m
        expr: probe_success{job="blackbox-mesh"} == 0
        for: 1m
        labels:
          severity: alert
          service: consul
          job: blackbox-mesh
        annotations:
          summary: "Consul service is unreachable on {{ $labels.instance }}"
          description: "Blackbox probe to Consul (port 8301) failed for {{ $labels.instance }} for more than 1 minute."