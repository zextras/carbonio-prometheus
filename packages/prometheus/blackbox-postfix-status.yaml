groups:
  - name: postfix_service_down
    interval: 15s
    rules:
      - alert: postfix_service_down_1h
        expr: max_over_time(probe_success{job="blackbox-postfix"}[1m]) == 0
        for: 1h
        labels:
          severity: blocker
          service: postfix
          job: blackbox-postfix
        annotations:
          summary: "Postfix service is unreachable on {{ $labels.instance }}"
          description: "Blackbox probe to Postfix (port 25) failed for {{ $labels.instance }} for more than 1 hour. Check MTA process, firewall, and network."

      - alert: postfix_service_down_30m
        expr: max_over_time(probe_success{job="blackbox-postfix"}[1m]) == 0
        for: 30m
        labels:
          severity: warning
          service: postfix
          job: blackbox-postfix
        annotations:
          summary: "Postfix service is unreachable on {{ $labels.instance }}"
          description: "Blackbox probe to Postfix failed for {{ $labels.instance }} for more than 30 minutes."

      - alert: postfix_service_down_1m
        expr: max_over_time(probe_success{job="blackbox-postfix"}[1m]) == 0
        for: 1m
        labels:
          severity: alert
          service: postfix
          job: blackbox-postfix
        annotations:
          summary: "Postfix service is unreachable on {{ $labels.instance }}"
          description: "Blackbox probe to Postfix failed for {{ $labels.instance }} for more than 1 minute."

