# This file must not be edited manually.
# To add a new scrape job, create a separate file in:
# /etc/carbonio/carbonio-prometheus/scrape_config.d/

scrape_configs:
  - job_name: "storages"
    consul_sd_configs:
      - server: "localhost:8500"
        token: "{{ consultoken }}"
        services:
          - "carbonio-storages"
    relabel_configs:
      - source_labels: ["__meta_consul_node"]
        regex: "(agent|server)-(.+)-{{ consulhostsdomain }}"
        replacement: "$2.{{ hostsdomain }}"
        target_label: instance
      - source_labels: [__meta_consul_address, __meta_consul_service_metadata_prom_port]
        separator: ":"
        target_label: __address__

  - job_name: "docs"
    metrics_path: /services/docs/editor/cool/getMetrics
    consul_sd_configs:
      - server: "localhost:8500"
        token: "{{ consultoken }}"
        services:
          - "carbonio-docs-editor"
    relabel_configs:
      - source_labels: ["__meta_consul_node"]
        regex: "(agent|server)-(.+)-{{ consulhostsdomain }}"
        replacement: "$2.{{ hostsdomain }}"
        target_label: instance
      - source_labels: [__meta_consul_address, __meta_consul_service_metadata_prom_port]
        separator: ":"
        target_label: __address__

  - job_name: "files"
    consul_sd_configs:
      - server: "localhost:8500"
        token: "{{ consultoken }}"
        services:
          - "carbonio-files"
    relabel_configs:
      - source_labels: ["__meta_consul_node"]
        regex: "(agent|server)-(.+)-{{ consulhostsdomain }}"
        replacement: "$2.{{ hostsdomain }}"
        target_label: instance
      - source_labels: [__meta_consul_address, __meta_consul_service_metadata_prom_port]
        separator: ":"
        target_label: __address__

  - job_name: "carbonio-mailbox"
    metrics_path: /service/metrics
    consul_sd_configs:
      - server: "localhost:8500"
        token: "{{ consultoken }}"
        datacenter: "dc1"
        services: ["carbonio-mailbox"]
    relabel_configs:
      - source_labels: [__meta_consul_node]
        regex: "(agent|server)-(.+)-{{ consulhostsdomain }}"
        replacement: "$2.{{ hostsdomain }}"
        target_label: instance
        action: replace

  - job_name: "advanced-auth"
    metrics_path: /service/extension/metrics/auth
    consul_sd_configs:
      - server: "localhost:8500"
        token: "{{ consultoken }}"
        datacenter: "dc1"
        services:
          - "carbonio-mailbox"
    relabel_configs:
      - source_labels: ["__meta_consul_node"]
        regex: "(agent|server)-(.+)-"
        replacement: "$2."
        target_label: instance

  - job_name: "advanced-powerstore"
    metrics_path: /service/extension/metrics/powerstore
    consul_sd_configs:
      - server: "localhost:8500"
        token: "{{ consultoken }}"
        datacenter: "dc1"
        services:
          - "carbonio-mailbox"
    relabel_configs:
      - source_labels: ["__meta_consul_node"]
        regex: "(agent|server)-(.+)-"
        replacement: "$2."
        target_label: instance