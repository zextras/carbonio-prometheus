groups:
  - name: mysql_service_down
    interval: 15s
    rules:
      - alert: mysql_service_down_1h
        expr: probe_success{job="blackbox-mysql"} == 0
        for: 1h
        labels:
          severity: blocker
          service: mysql
          job: blackbox-mysql
        annotations:
          summary: "MySQL service is unreachable on {{ $labels.instance }}"
          description: "Blackbox probe to MySQL failed for {{ $labels.instance }} for more than 1 hour. Check the MySQL process, firewall, and network connectivity."
      - alert: mysql_service_down_30m
        expr: probe_success{job="blackbox-mysql"} == 0
        for: 30m
        labels:
          severity: warning
          service: mysql
          job: blackbox-mysql
        annotations:
          summary: "MySQL service is unreachable on {{ $labels.instance }}"
          description: "Blackbox probe to MySQL failed for {{ $labels.instance }} for more than 30 minutes."
      - alert: mysql_service_down_1m
        expr: probe_success{job="blackbox-mysql"} == 0
        for: 1m
        labels:
          severity: alert
          service: mysql
          job: blackbox-mysql
        annotations:
          summary: "MySQL service is unreachable on {{ $labels.instance }}"
          description: "Blackbox probe to MySQL failed for {{ $labels.instance }} for more than 1 minute."
