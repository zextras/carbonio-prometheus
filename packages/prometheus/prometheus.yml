#Global config
global:
  scrape_interval: 30s # Set the scrape interval to every 30 seconds. Default is every 1 minute.
  evaluation_interval: 60s # Evaluate rules every 60 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
    - file_sd_configs:
        - files:
            - /etc/carbonio/carbonio-prometheus/alertmanager/*.yml

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "/etc/carbonio/carbonio-prometheus/rules/*.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"

    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
      - targets: ["localhost:9090"]

# Scrape jobs are loaded from separate files via scrape_config_files.
# To add new scrape jobs, create a separate file in:
# /etc/carbonio/carbonio-prometheus/scrape_config.d/
scrape_config_files:
  - /etc/carbonio/carbonio-prometheus/scrape_config.d/*.yml